# Hosts the Lumen Deploy dashboard itself on GitHub Pages.
# Do not enable Pages or push this until Josh approves.
name: Deploy Lumen Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/icons
          cp index.html manifest.json sw.js _site/
          cp icons/icon-192.png icons/icon-512.png icons/apple-touch-icon.png icons/favicon.png _site/icons/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
